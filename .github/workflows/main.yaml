name: CI/CD Deploy to Surge.sh

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Surge.sh
        run: npm install --global surge

      - name: Desplegar sitio web a Surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_DOMAIN: ${{ secrets.SURGE_DOMAIN }}
        run: |
          # Si SURGE_DOMAIN no está definido en secrets, se usa un subdominio por defecto
          TARGET_DOMAIN="${SURGE_DOMAIN:-orlando-surge-ci.surge.sh}"
          echo "Iniciando despliegue hacia: $TARGET_DOMAIN"
          surge ./ "$TARGET_DOMAIN" --token "$SURGE_TOKEN"
